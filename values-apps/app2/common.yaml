fullnameOverride: app2

replicaCount: 1

deployment:
  enabled: true
  podDisruptionBudget:
    enabled: true

service:
  enabled: true
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080

resources:
  limits:
    memory: 50Mi
  requests:
    cpu: 0.3
    memory: 50Mi

configmap:
  data:
    APP_VALUE: app2-value
