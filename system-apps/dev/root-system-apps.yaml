apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-root-system-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/giladsh1/applicationset.git
    targetRevision: HEAD
    path: system-apps/dev/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - Validate=true
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=false
