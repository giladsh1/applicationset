apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-applicationset-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/giladsh1/applicationset.git
    targetRevision: HEAD
    path: applicationsets
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
