apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dev-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/giladsh1/applicationset.git
        revision: HEAD
        files:
          - path: values-environments/argocd/dev/apps-list.json
        requeueAfterSeconds: 30
  template:
    metadata:
      name: "{{name}}-dev"
    spec:
      project: default
      source:
        repoURL: https://github.com/giladsh1/applicationset.git
        targetRevision: dev
        path: charts/main
        helm:
          valueFiles:
            - ../../values-environments/dev/common.yaml
            - ../../values-apps/{{name}}/common.yaml
            - ../../values-apps/{{name}}/dev.yaml
            - ../../versions/dev/{{name}}.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: charm
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - Validate=true
          - CreateNamespace=false
          - PrunePropagationPolicy=foreground
          - PruneLast=false
