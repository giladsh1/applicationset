apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  annotations:
    app.kubernetes.io/name: {{ .Values.appName }}
    app.kubernetes.io/version: {{ .Values.image.tag }}
    app.kubernetes.io/env: {{ .Values.env }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: "nginx:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
